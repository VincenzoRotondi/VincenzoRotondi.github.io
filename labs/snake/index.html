<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON_SNAKE_V1.0</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        canvas {
            border: 2px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            background-color: #000;
        }

        .stats {
            margin-bottom: 10px;
            width: 400px;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
        }

        .msg {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="stats">
        <span>Score: <span id="score">0</span></span>
        <span>High: <span id="high">0</span></span>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="msg">USE_ARROW_KEYS_TO_NAVIGATE</div>

    <script>
        class SnakeGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gridSize = 20;
                this.tileCount = this.canvas.width / this.gridSize;

                this.scoreElement = document.getElementById('score');
                this.highElement = document.getElementById('high');

                this.reset();
                this.highScore = localStorage.getItem('snake_high_score') || 0;
                this.highElement.innerText = this.highScore;

                document.addEventListener('keydown', this.onKeyPress.bind(this));

                this.gameLoop = setInterval(this.update.bind(this), 100);
            }

            reset() {
                this.snake = [{ x: 10, y: 10 }];
                this.food = { x: 5, y: 5 };
                this.dx = 0;
                this.dy = 0;
                this.score = 0;
                this.scoreElement.innerText = this.score;
            }

            update() {
                this.moveSnake();
                if (this.checkCollision()) {
                    this.onGameOver();
                    return;
                }
                this.checkFood();
                this.draw();
            }

            moveSnake() {
                const head = { x: this.snake[0].x + this.dx, y: this.snake[0].y + this.dy };
                this.snake.unshift(head);
                if (!this.didEatFood) {
                    this.snake.pop();
                }
                this.didEatFood = false;
            }

            checkCollision() {
                const head = this.snake[0];

                if (head.x < 0 || head.x >= this.tileCount || head.y < 0 || head.y >= this.tileCount) return true;

                for (let i = 1; i < this.snake.length; i++) {
                    if (this.snake[i].x === head.x && this.snake[i].y === head.y) return true;
                }

                return false;
            }

            checkFood() {
                if (this.snake[0].x === this.food.x && this.snake[0].y === this.food.y) {
                    this.score += 10;
                    this.scoreElement.innerText = this.score;
                    this.didEatFood = true;
                    this.spawnFood();

                    if (this.score > this.highScore) {
                        this.highScore = this.score;
                        this.highElement.innerText = this.highScore;
                        localStorage.setItem('snake_high_score', this.highScore);
                    }
                }
            }

            spawnFood() {
                this.food = {
                    x: Math.floor(Math.random() * this.tileCount),
                    y: Math.floor(Math.random() * this.tileCount)
                };
            }

            onKeyPress(e) {
                switch (e.key) {
                    case 'ArrowUp': if (this.dy === 0) { this.dx = 0; this.dy = -1; } break;
                    case 'ArrowDown': if (this.dy === 0) { this.dx = 0; this.dy = 1; } break;
                    case 'ArrowLeft': if (this.dx === 0) { this.dx = -1; this.dy = 0; } break;
                    case 'ArrowRight': if (this.dx === 0) { this.dx = 1; this.dy = 0; } break;
                }
            }

            onGameOver() {
                alert(`SYSTEM_FAILURE: Score ${this.score}`);
                this.reset();
            }

            draw() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#00ff41';
                this.snake.forEach(part => {
                    this.ctx.fillRect(part.x * this.gridSize, part.y * this.gridSize, this.gridSize - 2, this.gridSize - 2);
                });

                this.ctx.fillStyle = '#fff';
                this.ctx.fillRect(this.food.x * this.gridSize, this.food.y * this.gridSize, this.gridSize - 2, this.gridSize - 2);
            }
        }

        new SnakeGame();
    </script>
</body>

</html>
